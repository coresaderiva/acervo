<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando para @coresaderiva...</title>
    
    <!-- Redirecionamento via meta tag -->
    <meta http-equiv="refresh" content="3; url=https://www.instagram.com/coresaderiva/">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f09433 0%, #d62976 50%, #962fbf 100%);
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .instagram-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        .countdown {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
        }
        
        .message {
            margin: 20px 0;
            line-height: 1.6;
        }
        
        .link {
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid #ffd700;
            border-radius: 25px;
            transition: all 0.3s ease;
            display: inline-block;
            margin-top: 20px;
        }
        
        .link:hover {
            background: #ffd700;
            color: #333;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        
        .countdown-number {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="instagram-icon">📸</div>
        <h1>Redirecionando para @coresaderiva</h1>
        <div class="message">
            Você será enviado para o perfil do Instagram em
        </div>
        <div class="countdown">
            <span id="countdown-number" class="countdown-number">3</span> segundos
        </div>
        <div class="message">
            Se o redirecionamento não funcionar automaticamente,<br>
            <a href="https://www.instagram.com/coresaderiva/" class="link">clique aqui para ir ao perfil</a>
        </div>
    </div>

    <script>
        let seconds = 3;
        const countdownElement = document.getElementById('countdown-number');
        
        const interval = setInterval(() => {
            seconds--;
            countdownElement.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = 'https://www.instagram.com/coresaderiva/';
            }
        }, 1000);
        
        setTimeout(() => {
            clearInterval(interval);
        }, 3000);
    </script>
</body>
</html>
